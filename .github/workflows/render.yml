name: Render Video

on:
  push:
    paths:
      - "data/sceneData.json"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Render video
        run: npm run render

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-renderizado
          path: out/video.mp4

      - name: Upload MP4 to release
        if: startsWith(github.ref, "refs/tags/v")
        uses: softprops/action-gh-release@v2
        with:
          files: out/video.mp4
      - name: Upload MP4 to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/video.mp4
